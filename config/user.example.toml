# yggr 用户配置示例 - 复制为 user.toml 后修改密码
# 注意: 密码以明文写在配置中,请使用强密码并妥善保管
# 角色不在此配置;登录后通过前端或 API 创建

[[users]]
username = "admin@example.com"         # 邮箱或用户名(登录时填写)
password = "CHANGE_ME_STRONG_PASSWORD"
preferred_language = "zh_CN"

# 可以继续添加更多用户
# [[users]]
# username = "player2@example.com"
# password = "ANOTHER_STRONG_PASSWORD"
# preferred_language = "en_US"
